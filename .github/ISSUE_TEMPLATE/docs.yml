name: Docs issue
description: A docs page is missing, wrong, or drifted from the code.
title: "[docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: e.g. /docs/components/dialog
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of issue?
      options:
        - Missing page or section (template requires Installation → Usage → Examples → Motion → Accessibility)
        - Content drifted from the code (e.g. Motion section no longer matches behavior)
        - Missing from nav-items.ts or the components overview grid
        - Typo / wording
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What's wrong, and what should it say instead?
    validations:
      required: true
