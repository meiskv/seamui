name: Release CLI

# Publish the `seamui` CLI to npm when a version tag is pushed:
#   1. bump `packages/seamui/package.json` version
#   2. commit, then `git tag vX.Y.Z && git push --tags`
#
# Requires an `NPM_TOKEN` repo secret (an npm **Automation** token, which
# bypasses 2FA for CI publishes).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm provenance attestation

jobs:
  publish:
    name: Publish seamui CLI to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        working-directory: packages/seamui
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match packages/seamui version $PKG"
            exit 1
          fi
      - name: Skip if this version is already on npm
        id: check
        working-directory: packages/seamui
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VER is already published — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Publishing $NAME@$VER"
          fi
      - name: Build CLI
        if: steps.check.outputs.exists != 'true'
        run: bun run --cwd packages/seamui build
      # Provenance is public-repo-only (npm rejects it for private sources);
      # publish without it while this repo is private. Re-add --provenance if
      # the repo ever goes public.
      - name: Publish to npm
        if: steps.check.outputs.exists != 'true'
        working-directory: packages/seamui
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
